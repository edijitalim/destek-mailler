<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destek Talebi Oluştur</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 20px 68px 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 540px;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #e2e8f0;
        }

        .optional-tag {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 400;
        }

        .upload-help {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .upload-help a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }

        .upload-help a:hover {
            text-decoration: underline;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: #a7f3d0;
            font-size: 14px;
            line-height: 1.6;
        }

        .ticket-badge {
            display: inline-block;
            margin: 8px 0;
            padding: 6px 12px;
            background-color: #064e3b;
            border: 1px solid var(--success);
            border-radius: 6px;
            color: #ffffff;
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .download-txt-btn, .copy-btn {
            padding: 8px 14px;
            background-color: var(--success);
            color: #064e3b;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 13px;
        }

        .copy-btn {
            background-color: #334155;
            color: #f8fafc;
        }

        .badge-blocker {
            position: fixed;
            right: 8px;
            bottom: 8px;
            width: 152px;
            height: 40px;
            border-radius: 999px;
            background-color: var(--bg-color);
            z-index: 2147483647;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Destek Talebi</h1>
        <p>Yaşadığınız sorunu veya talebinizi aşağıdan iletebilirsiniz. Kaydınız otomatik olarak sisteme işlenecek ve size bir talep numarası verilecektir.</p>
    </div>

    <form id="supportForm">
        <div class="form-group">
            <label for="adSoyad">Adınız Soyadınız</label>
            <input type="text" id="adSoyad" name="ad_soyad" placeholder="Örn: Ahmet Yılmaz" required>
        </div>

        <div class="form-group">
            <label for="eposta">E-posta Adresiniz</label>
            <input type="email" id="eposta" name="eposta" placeholder="ornek@alanadi.com" required>
        </div>

        <div class="form-group">
            <label for="kategori">Konu / Kategori</label>
            <select id="kategori" name="kategori" required>
                <option value="Teknik Sorun">Teknik Sorun</option>
                <option value="Hesap ve Erişim">Hesap ve Erişim</option>
                <option value="Öneri / Geri Bildirim">Öneri / Geri Bildirim</option>
                <option value="Diğer">Diğer</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gorselUrl">Görsel Bağlantısı <span class="optional-tag">(İsteğe bağlı)</span></label>
            <input type="url" id="gorselUrl" name="gorsel_url" placeholder="https://ibb.co/... veya https://postimg.cc/...">
            <div class="upload-help">
                Üyelik gerektirmeden görsel yüklemek için aç:
                <a href="https://imgbb.com/" target="_blank" rel="noopener noreferrer">ImgBB</a> ·
                <a href="https://postimages.org/" target="_blank" rel="noopener noreferrer">Postimages</a>
            </div>
        </div>

        <div class="form-group">
            <label for="mesaj">Talebiniz</label>
            <textarea id="mesaj" name="mesaj" placeholder="Detayları buraya yazabilirsiniz..." required></textarea>
        </div>

        <button type="submit" class="btn" id="submitBtn">Talebi Gönder</button>
    </form>

    <div class="status-box" id="statusBox">
        <strong>Talebiniz başarıyla alındı!</strong><br>
        Takip için talep numaranız:<br>
        <div class="ticket-badge" id="ticketNoDisplay">TLP-000000</div>
        <div class="action-row">
            <button type="button" class="copy-btn" id="copyTicketBtn">Talep No Kopyala</button>
            <button type="button" class="download-txt-btn" id="downloadTxtBtn">Kopyasını .TXT Olarak İndir</button>
        </div>
    </div>
</div>

<div class="badge-blocker" aria-hidden="true"></div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBZBQyaScLQNneU1FLbyjhk2DGPuqyXaVE3Bc-c7CTQ3HQS7TvSi9t-S9Ckyjz_-xR/exec";

    const form = document.getElementById('supportForm');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const copyTicketBtn = document.getElementById('copyTicketBtn');
    const ticketNoDisplay = document.getElementById('ticketNoDisplay');

    let sonGonderilenVeri = "";
    let sonTalepNo = "";

    function talepNoUret() {
        const now = new Date();
        const yil = now.getFullYear();
        const ay = String(now.getMonth() + 1).padStart(2, '0');
        const gun = String(now.getDate()).padStart(2, '0');
        const rastgele = Math.floor(1000 + Math.random() * 9000);
        return `TLP-${yil}${ay}${gun}-${rastgele}`;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = "Gönderiliyor...";

        const formData = new FormData(form);
        const tarih = new Date().toLocaleString('tr-TR');
        sonTalepNo = talepNoUret();
        const gorselLink = (formData.get('gorsel_url') || "").trim();

        sonGonderilenVeri = `=== DESTEK TALEBİ KAYDI ===\n` +
                            `Talep No: ${sonTalepNo}\n` +
                            `Tarih: ${tarih}\n` +
                            `Ad Soyad: ${formData.get('ad_soyad')}\n` +
                            `E-posta: ${formData.get('eposta')}\n` +
                            `Kategori: ${formData.get('kategori')}\n` +
                            `Görsel Bağlantısı: ${gorselLink || "Yok"}\n` +
                            `-----------------------------\n` +
                            `Mesaj:\n${formData.get('mesaj')}\n` +
                            `=============================`;

        const params = new URLSearchParams();
        params.append("talep_no", sonTalepNo);
        params.append("ad_soyad", formData.get('ad_soyad') || "");
        params.append("eposta", formData.get('eposta') || "");
        params.append("kategori", formData.get('kategori') || "");
        params.append("gorsel_url", gorselLink);
        params.append("mesaj", formData.get('mesaj') || "");

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: params
        })
        .then(() => {
            form.reset();
            ticketNoDisplay.textContent = sonTalepNo;
            statusBox.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "Yeni Talep Gönder";
        })
        .catch((error) => {
            console.error("Gönderim hatası:", error);
            alert("Gönderim sırasında hata oluştu. Lütfen tekrar deneyin.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Talebi Gönder";
        });
    });

    copyTicketBtn.addEventListener('click', function() {
        navigator.clipboard.writeText(sonTalepNo);
        copyTicketBtn.textContent = "Kopyalandı!";
        setTimeout(() => copyTicketBtn.textContent = "Talep No Kopyala", 2000);
    });

    downloadTxtBtn.addEventListener('click', function() {
        const blob = new Blob([sonGonderilenVeri], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${sonTalepNo}.txt`;
        link.click();
    });
</script>

</body>
</html>
